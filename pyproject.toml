[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "transfo"
description = "Ergonomic in-memory transformations operations , using NGFF for read/write"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Luca Marconato", email = "luca.marconato@embl.de" },
]
authors = [
  { name = "Luca Marconato" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "anndata",
  # for debug logging (referenced from the issue template)
  "session-info2",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://transfo---.readthedocs.io/"
urls.Homepage = "https://github.com/Spatial-Innovation-Team/transfo---"
urls.Source = "https://github.com/Spatial-Innovation-Team/transfo---"

[dependency-groups]
dev = [
  "prek",
  "twine>=4.0.2",
  "ty>=0.0.53",
]
test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]

[tool.hatch]
version.source = "vcs"
envs.default.installer = "uv"
# creating and managing dev env
envs.default.scripts.create-init-dev-env = "hatch env create dev && hatch run dev:prek-install"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.dev.path = ".venv"
envs.dev.scripts.prek-install = "prek install"
envs.dev.scripts.prek-run-all-files = "prek run --all-files {args}"
envs.dev.scripts.prek-run-staged = "prek run {args}"
envs.dev.scripts.test = "pytest {args}"
envs.dev.scripts.test-cov = "pytest --cov=transfo --cov-report=term-missing {args}"
envs.dev.dependency-groups = [ "dev", "test" ]

# formatting and linting
[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
fix = true
format.quote-style = "single"
format.line-ending = "lf"
format.docstring-code-format = true
format.lint.ignore = [
  "B008",   # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107",   # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203",   # We don’t want a blank line before a class docstring
  "D213",   # <> We want docstrings to start immediately after the opening triple quote
  "D400",   # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401",   # First line should be in imperative mood; try rephrasing
  "E501",   # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731",   # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741",   # allow I, O, l as variable names -> I is the identity matrix
  "TC001",
  "TC002",
  "TC003",
  "COM819", # conflicts with ruff-format
  "RET504", # not fixed yet https://github.com/charliermarsh/ruff/issues/2950
  "TRY003", # require implement multiple exception class
  "RUF005", # problem with numpy compatybility, see https://github.com/charliermarsh/ruff/issues/2142#issuecomment-1451038741
  "B028",   # need to be fixed
  "W191",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "ISC001", # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "TC006",  # put types in quotes in typing.cast
]
format.lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
  "YTT",    # flake8-2020
  "TC",     # flake8-type-checking
  "A",      # flake8-builtins
  "ISC",    # flake8-implicit-str-concat
  "G",      # flake8-logging-format
  "PIE",    # flake8-pie
  "COM",    # flake8-commas
  "SIM",    # flake8-simplify
  "INP",    # flake8-no-pep420
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RSE",    # flake8-raise
  "RET",    # flake8-return
  "TRY",    # tryceratops
  "ICN",    # flake8-import-conventions
  "RUF",    # ruff-specific rules
  "NPY201", # numpy 2.0 compatibility
  "ASYNC",  # flake8-async
  "EXE",    # flake8-executable
  "FA",     # flake8-future-annotations
  "LOG",    # flake8-logging
  "SLOT",   # flake8-slots
  "PT",     # flake8-pytest-style
  "T20",    # flake8-print
]
lint.flake8-builtins.builtins-allowed-modules = [ "io", "types", "threading" ]
# Declare a custom alias for the `matplotlib` module.
lint.flake8-import-conventions.extend-aliases."dask.array" = "da"
lint.flake8-import-conventions.extend-aliases.lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.flake8-import-conventions.extend-aliases.lint.per-file-ignores."docs/*" = [ "I" ]
lint.flake8-import-conventions.extend-aliases.lint.per-file-ignores."tests/*" = [ "D" ]
lint.flake8-import-conventions.extend-aliases.lint.pydocstyle.convention = "numpy"
lint.flake8-import-conventions.extend-aliases.xarray = "xr"
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "single"
lint.flake8-quotes.multiline-quotes = "double"
# Disallow all relative imports.
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.isort.combine-as-imports = true
lint.isort.known-first-party = [ "transfo" ]
lint.pyupgrade.keep-runtime-typing = true

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]
run.source = [ "transfo" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
